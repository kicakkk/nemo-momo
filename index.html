<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System32.exe has stopped working</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #fff; font-family: 'Courier New', monospace;
    width: 100vw; height: 100vh; overflow: hidden; cursor: none;
  }

  /* Ekran terminala */
  #terminal-screen {
    position: absolute; inset: 0; padding: 20px;
    font-size: 18px; line-height: 1.4; white-space: pre-wrap;
    z-index: 10; text-shadow: 0 0 5px #fff;
  }

  /* Zdjęcie - Pierdolnięcie */
  #jumpscare-screen {
    position: absolute; inset: 0; background: #000;
    z-index: 20; display: none;
    justify-content: center; align-items: center; flex-direction: column;
  }
  #jumpscare-screen img {
    width: 80%; max-width: 600px; filter: grayscale(100%) contrast(200%);
    animation: zoomIn 0.1s forwards;
  }
  #jumpscare-screen h1 {
    color: #f00; font-size: 5rem; margin-top: 20px;
    text-shadow: 0 0 20px #f00;
  }
  @keyframes zoomIn {
    from { transform: scale(0.1); }
    to { transform: scale(1); }
  }

  /* Stroboskop */
  #strobe-screen {
    position: absolute; inset: 0; background: #fff;
    z-index: 30; display: none;
  }
  .flash-black { background: #000 !important; }
  .flash-white { background: #fff !important; }

  /* Blue Screen (BSOD) */
  #bsod-screen {
    position: absolute; inset: 0; background: #0078D7;
    z-index: 40; display: none; color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 10% 15%; flex-direction: column; justify-content: flex-start;
  }
  #bsod-screen h1 { font-size: 10rem; margin-bottom: 20px; }
  #bsod-screen p { font-size: 2rem; max-width: 800px; line-height: 1.3; }
  #bsod-screen .code { font-size: 1.2rem; margin-top: 30px; color: #ccc; }
</style>
</head>
<body>

<!-- Ekran 1: Terminal -->
<div id="terminal-screen"></div>

<!-- Ekran 2: Jumpscare -->
<div id="jumpscare-screen">
  <!-- Tutaj odwołujemy się do wgranego pliku jumpscare.jpg -->
  <img src="jumpscare.jpg" alt="SYSTEM FAILURE">
  <h1>SYSTEM OVERRIDE</h1>
</div>

<!-- Ekran 3: Stroboskop -->
<div id="strobe-screen"></div>

<!-- Ekran 4: Blue Screen -->
<div id="bsod-screen">
  <h1>:(</h1>
  <p>Twój komputer napotkał problem i wymaga ponownego uruchomienia. Trwa zbieranie informacji o błędzie, a następnie nastąpi ponowne uruchomienie.</p>
  <p class="code">Kod błędu: 0x000000F4<br>Błąd: CRITICAL_PROCESS_DIED</p>
</div>

<script>
// Blokada prawego przycisku myszy
document.addEventListener('contextmenu', e => e.preventDefault());

// Sekwencja zdarzeń
function startSequence() {
  const term = document.getElementById('terminal-screen');
  term.style.display = 'block';
  
  const hakerText = [
    "> Inicjalizacja protokołu awaryjnego...",
    "> Pobieranie danych z serwera 192.168.1.666...",
    "> Bypass firewall... SUKCES.",
    "> Pobieranie plików systemowych...",
    "> UWAGA: Wykryto intruza!",
    "> Inicjalizacja procedury zniszczenia...",
    "> 10%... 50%... 99%...",
    "> BŁĄD KRYTYCZNY. SYSTEM ZARAZ WYBUCHNIE."
  ];
  
  let i = 0;
  const interval = setInterval(() => {
    if (i < hakerText.length) {
      term.innerText += hakerText[i] + "\n";
      i++;
    } else {
      clearInterval(interval);
      setTimeout(triggerJumpscare, 1500);
    }
  }, 300); 
}

// 2. Jumpscare i Stroboskop
function triggerJumpscare() {
  document.getElementById('terminal-screen').style.display = 'none';
  const jump = document.getElementById('jumpscare-screen');
  jump.style.display = 'flex';
  
  document.documentElement.requestFullscreen().catch(() => {});

  setTimeout(() => {
    jump.style.display = 'none';
    const strobe = document.getElementById('strobe-screen');
    strobe.style.display = 'block';
    
    let flashCount = 0;
    const strobeInterval = setInterval(() => {
      strobe.className = (flashCount % 2 === 0) ? 'flash-white' : 'flash-black';
      flashCount++;
      
      if (flashCount > 15) {
        clearInterval(strobeInterval);
        strobe.style.display = 'none';
        document.getElementById('bsod-screen').style.display = 'flex';
      }
    }, 80);
  }, 2000); 
}

// 3. Blokada klawisza ESC i F11
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' || e.key === 'F11') {
    e.preventDefault(); 
  }
});

// Odpalenie sekwencji
document.body.addEventListener('click', () => {
  startSequence();
}, { once: true });

// Ekran startowy
document.getElementById('terminal-screen').innerHTML = "<span style='color:#fff; font-size:24px;'>Kliknij, aby zaktualizować system (WAŻNE)</span>";

</script>
</body>
</html>
