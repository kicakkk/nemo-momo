<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System32.exe has stopped working</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #fff; font-family: 'Courier New', monospace;
    width: 100vw; height: 100vh; overflow: hidden; cursor: none;
  }

  /* Ekran terminala */
  #terminal-screen {
    position: absolute; inset: 0; padding: 20px;
    font-size: 18px; line-height: 1.4; white-space: pre-wrap;
    z-index: 10; text-shadow: 0 0 5px #fff;
  }

  /* Zdjęcie - Pierdolnięcie */
  #jumpscare-screen {
    position: absolute; inset: 0; background: #000;
    z-index: 20; display: none;
    justify-content: center; align-items: center; flex-direction: column;
    animation: shake 0.1s infinite;
  }
  @keyframes shake {
    0% { transform: translate(5px, 5px) rotate(1deg); }
    50% { transform: translate(-5px, -5px) rotate(-1deg); }
    100% { transform: translate(5px, 5px) rotate(1deg); }
  }

  #jumpscare-screen img {
    width: 80%; max-width: 600px; 
    filter: grayscale(100%) contrast(200%) brightness(80%) sepia(50%) hue-rotate(300deg);
    animation: zoomIn 0.1s forwards;
  }
  #jumpscare-screen h1 {
    color: #f00; font-size: 5rem; margin-top: 20px;
    text-shadow: 0 0 20px #f00, 0 0 40px #f00;
  }
  @keyframes zoomIn {
    from { transform: scale(0.1); }
    to { transform: scale(1); }
  }

  /* Stroboskop z GIF-em w tle */
  #strobe-screen {
    position: absolute; inset: 0;
    background: transparent;
    z-index: 30; display: none;
    overflow: hidden;
  }
  #strobe-screen::before {
    content: "";
    position: absolute; inset: 0;
    background-image: url('https://i.pinimg.com/originals/b6/e1/b7/b6e1b7f9ef3227a4294385d9980a50d3.gif');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -1;
  }
  .flash-black { background-color: rgba(0, 0, 0, 0.6) !important; }
  .flash-white { background-color: rgba(255, 255, 255, 0.6) !important; }

  /* Blue Screen (BSOD) */
  #bsod-screen {
    position: absolute; inset: 0; background: #0078D7;
    z-index: 40; display: none; color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 10% 15%; flex-direction: column; justify-content: flex-start;
  }
  #bsod-screen h1 { font-size: 10rem; margin-bottom: 20px; }
  #bsod-screen p { font-size: 2rem; max-width: 800px; line-height: 1.3; }
  #bsod-screen .code { font-size: 1.2rem; margin-top: 30px; color: #ccc; }
</style>
</head>
<body>

<!-- Ekran 1: Terminal -->
<div id="terminal-screen"></div>

<!-- Ekran 2: Jumpscare -->
<div id="jumpscare-screen">
  <img src="jumpscare.jpg" alt="SYSTEM FAILURE">
  <h1>SYSTEM OVERRIDE</h1>
</div>

<!-- Ekran 3: Stroboskop -->
<div id="strobe-screen"></div>

<!-- Ekran 4: Blue Screen -->
<div id="bsod-screen">
  <h1>:(</h1>
  <p>Twój komputer napotkał problem i wymaga ponownego uruchomienia. Trwa zbieranie informacji o błędzie, a następnie nastąpi ponowne uruchomienie.</p>
  <p class="code">Kod błędu: 0x000000F4<br>Błąd: CRITICAL_PROCESS_DIED</p>
</div>

<script>
// Blokada prawego przycisku myszy
document.addEventListener('contextmenu', e => e.preventDefault());

// --- SYSTEM DŹWIĘKOWY ---
let audioCtx;
let monsterNodes = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

// Funkcja tworząca zniekształcenie (distortion) - klucz do dźwięku potwora
function createDistortionCurve(amount) {
  let k = typeof amount === 'number' ? amount : 50;
  let n_samples = 44100;
  let curve = new Float32Array(n_samples);
  let deg = Math.PI / 180;
  for (let i = 0; i < n_samples; ++i) {
    let x = i * 2 / n_samples - 1;
    curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
  }
  return curve;
}

// 1. DŹWIĘK POTWORA (Wrra a a a)
function startMonsterSound() {
  initAudio();
  
  const osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.value = 30; // Bardzo niski bas (30 Hz)

  const lfo = audioCtx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 4; // Wolne bicie serca/potwora
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 10; 
  lfo.connect(lfoGain);
  lfoGain.connect(osc.frequency);

  const distortion = audioCtx.createWaveShaper();
  distortion.curve = createDistortionCurve(400); // Mocne zniekształcenie
  distortion.oversample = '4x';

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 150; // Odcina wysokie tony, zostaje mrok

  const gain = audioCtx.createGain();
  gain.gain.value = 0;
  // Narastanie głośności (zaczyna cicho, po 4 sekundach jest głośno)
  gain.gain.linearRampToValueAtTime(0.8, audioCtx.currentTime + 4);

  osc.connect(distortion);
  distortion.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  lfo.start();
  
  monsterNodes = { osc, lfo, gain };
}

// 2. DŹWIĘK JUMPSCARA (Uderzenie i szum)
function playJumpscareSound() {
  if (!audioCtx) return;

  // Uciszamy potwora
  if (monsterNodes) {
    monsterNodes.gain.gain.cancelScheduledValues(audioCtx.currentTime);
    monsterNodes.gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    setTimeout(() => {
      try { monsterNodes.osc.stop(); monsterNodes.lfo.stop(); } catch(e){}
    }, 200);
  }

  // Generujemy biały szum (brzmi jakby coś się rozpadło)
  const bufferSize = audioCtx.sampleRate * 1.5; 
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 1000;

  // Dodatkowy niski bas uderzający w klatę
  const impactOsc = audioCtx.createOscillator();
  impactOsc.type = 'sawtooth';
  impactOsc.frequency.setValueAtTime(150, audioCtx.currentTime);
  impactOsc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 1);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(1.5, audioCtx.currentTime); // Bardzo głośno!
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

  noise.connect(noiseFilter);
  noiseFilter.connect(gain);
  impactOsc.connect(gain);
  gain.connect(audioCtx.destination);

  noise.start();
  impactOsc.start();
  noise.stop(audioCtx.currentTime + 1.5);
  impactOsc.stop(audioCtx.currentTime + 1.5);
}
// ----------------------------------------

function startSequence() {
  const term = document.getElementById('terminal-screen');
  term.style.display = 'block';
  
  startMonsterSound();

  const hakerText = [
    "> Inicjalizacja protokołu awaryjnego...",
    "> Pobieranie danych z serwera 192.168.1.666...",
    "> Bypass firewall... SUKCES.",
    "> Pobieranie plików systemowych...",
    "> UWAGA: Wykryto intruza!",
    "> Inicjalizacja procedury zniszczenia...",
    "> 10%... 50%... 99%...",
    "> BŁĄD KRYTYCZNY. SYSTEM ZARAZ WYBUCHNIE."
  ];
  
  let i = 0;
  const interval = setInterval(() => {
    if (i < hakerText.length) {
      term.innerText += hakerText[i] + "\n";
      i++;
    } else {
      clearInterval(interval);
      setTimeout(triggerJumpscare, 1000);
    }
  }, 150); 
}

function triggerJumpscare() {
  document.getElementById('terminal-screen').style.display = 'none';
  const jump = document.getElementById('jumpscare-screen');
  jump.style.display = 'flex';
  
  playJumpscareSound();

  document.documentElement.requestFullscreen().catch(() => {});

  setTimeout(() => {
    jump.style.display = 'none';
    const strobe = document.getElementById('strobe-screen');
    strobe.style.display = 'block';
    
    let flashCount = 0;
    const strobeInterval = setInterval(() => {
      strobe.className = (flashCount % 2 === 0) ? 'flash-white' : 'flash-black';
      flashCount++;
      
      if (flashCount > 40) {
        clearInterval(strobeInterval);
        strobe.style.display = 'none';
        document.getElementById('bsod-screen').style.display = 'flex';
      }
    }, 30); 
  }, 1500); 
}

// Blokada ESC i F11
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' || e.key === 'F11') {
    e.preventDefault(); 
  }
});

document.body.addEventListener('click', () => {
  startSequence();
}, { once: true });

// Ekran startowy
document.getElementById('terminal-screen').innerHTML = "<span style='color:#fff; font-size:24px;'>Kliknij, aby zaktualizować system (WAŻNE)</span>";

</script>
</body>
</html>
