<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM CRITICAL ERROR</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; color: #0f0;
    font-family: 'Courier New', monospace; overflow: hidden;
    cursor: none; user-select: none;
  }
  
  /* Efekt wstrząsu ekranu */
  @keyframes shake {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    10% { transform: translate(-1px, -2px) rotate(-1deg); }
    20% { transform: translate(-3px, 0px) rotate(1deg); }
    30% { transform: translate(3px, 2px) rotate(0deg); }
    40% { transform: translate(1px, -1px) rotate(1deg); }
    50% { transform: translate(-1px, 2px) rotate(-1deg); }
    60% { transform: translate(-3px, 1px) rotate(0deg); }
    70% { transform: translate(3px, 1px) rotate(-1deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    90% { transform: translate(1px, 2px) rotate(0deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
  }
  .shake { animation: shake 0.5s; animation-iteration-count: infinite; }

  #matrix { position: fixed; inset: 0; z-index: 0; opacity: 0.2; pointer-events: none; }

  /* Główny terminal */
  #terminal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    padding: 20px; font-size: 16px; line-height: 1.3;
    white-space: pre-wrap; overflow: hidden; z-index: 2;
    text-shadow: 0 0 5px #0f0;
  }
  .err { color: #f33; font-weight: bold; text-shadow: 0 0 8px #f00; }
  .warn { color: #ff0; }

  /* Wyskakujące okienka z błędami */
  .popup {
    position: fixed; z-index: 9999; padding: 15px;
    background: #200; border: 2px solid #f00; color: #fff;
    font-family: monospace; font-size: 14px; box-shadow: 0 0 20px #f00;
    pointer-events: none; white-space: nowrap;
  }
  
  /* Paski glitchowe */
  .glitch-bar {
    position: fixed; left: 0; width: 100%; height: 2px;
    background: #f00; z-index: 9998; pointer-events: none;
    opacity: 0.8; box-shadow: 0 0 10px #f00;
  }
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<div id="terminal"></div>

<script>
// --- 1. EFEKT MATRIX (tło) ---
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*'.split('');
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = [];
for (let x = 0; x < columns; x++) drops[x] = 1;

function drawMatrix() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0F0';
  ctx.font = fontSize + 'px monospace';
  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(drawMatrix, 35);

// --- 2. TERMINAL (tekst się leje) ---
const terminal = document.getElementById('terminal');
const errors = [
  '[CRITICAL] System32 files corrupted...',
  '[ERROR] Cannot access memory at 0x00A1B2C3',
  '> WARNING: Overheating detected!',
  '> Injecting payload... SUCCESS',
  '> Ransomware encrypted your files.',
  '> JUST KIDDING. But you are scared, right?',
  '> Your IP: 192.168.1.1 (tracking active)',
  '> Sending data to server...',
  '> [FATAL] Kernel panic.',
  '> SYSTEM FAILURE IN 3... 2... 1...'
];

function writeLine() {
  const div = document.createElement('div');
  const r = Math.random();
  if (r < 0.4) div.className = 'err';
  else if (r < 0.7) div.className = 'warn';
  
  div.textContent = errors[Math.floor(Math.random() * errors.length)];
  terminal.appendChild(div);
  
  // Auto-scroll i usuwanie starych
  terminal.scrollTop = terminal.scrollHeight;
  if (terminal.childNodes.length > 50) terminal.removeChild(terminal.firstChild);
}
setInterval(writeLine, 100);

// --- 3. WYSKAKUJĄCE OKIENKA Z BŁĘDAMI ---
const popupTexts = [
  'BŁĄD KRYTYCZNY',
  'ZŁAPANO WIRUSA',
  'SYSTEM ZARAZ WYBUCHNIE',
  '404 NIE MA TEGO PLIKU',
  'HACKED',
  'WYŚLIJ 1000$ W BITCOINIE',
  'ERROR 0x000000F4',
  'UTRATA DANYCH'
];

function createPopup() {
  const p = document.createElement('div');
  p.className = 'popup';
  p.textContent = popupTexts[Math.floor(Math.random() * popupTexts.length)];
  
  // Losowa pozycja
  p.style.left = (Math.random() * (window.innerWidth - 200)) + 'px';
  p.style.top = (Math.random() * (window.innerHeight - 50)) + 'px';
  
  document.body.appendChild(p);
  
  // Znikają po chwili (1-3 sekundy)
  setTimeout(() => p.remove(), Math.random() * 2000 + 1000);
}

// --- 4. PASEK GLITCHU ---
function createGlitchBar() {
  const bar = document.createElement('div');
  bar.className = 'glitch-bar';
  bar.style.top = (Math.random() * window.innerHeight) + 'px';
  document.body.appendChild(bar);
  setTimeout(() => bar.remove(), 150);
}

// --- 5. ODPALANIE CHAOSU (po 2 sekundach od wejścia) ---
setTimeout(() => {
  // Wstrząs ekranu
  document.body.classList.add('shake');
  
  // Wyskakujące okienka (coraz szybciej)
  let popupInterval = setInterval(createPopup, 200);
  
  // Glitch paski
  setInterval(createGlitchBar, 100);

  // Po 10 sekundach zamykamy stronę (jeśli przeglądarka pozwoli)
  setTimeout(() => {
    clearInterval(popupInterval);
    setInterval(createPopup, 1000); // spowolnienie
    document.body.classList.remove('shake');
    
    // Opcjonalnie: window.close(); (przeglądarka może zablokować)
  }, 10000);

}, 2000);
</script>
</body>
</html>
